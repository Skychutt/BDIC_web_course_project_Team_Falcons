[project]
name = "falcons-cinema-assistant"
version = "0.1.0"
description = "A bilingual Flask cinema assistant with replaceable DeepSeek and catalog adapters"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<3.2", "openai>=1.66,<3", "httpx>=0.27,<1", "pydantic>=2.10,<3", "python-dotenv>=1.0,<2", "SQLAlchemy>=2.0,<2.1", "PyMySQL[rsa]>=1.1,<1.2", "waitress>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cinema", "cinema_ai"]

[tool.setuptools.package-data]
cinema_ai = ["templates/*.html", "static/*", "data/*.json"]
cinema = ["sql/*.sql", "templates/*.html", "static/*.css", "static/js/*.js", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend_tests"]
pythonpath = ["."]

